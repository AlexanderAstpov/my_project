<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        /* Общие стили */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Стили для Header */
        header {
            position: fixed; /* Фиксирует положение элемента относительно окна браузера */
            top: 0;          /* Прижимает к верхней границе */
            left: 0;
            width: 100%;
            background-color: #927070;
            color: rgb(133, 230, 146);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        nav {
            text-align: center;
            margin-right: 50%;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            text-align: center;
        }

        /* Стили для Footer */
        footer {

            position: fixed; /* Фиксирует положение элемента относительно окна браузера */
            bottom: 0; /* Прижимает к нижней границе */
            left: 0;
            width: 100%;
            background-color: #f4f4f4;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
            border-top: 1px solid #ddd;
        }
        
        /* Стили из прошлого примера (для карточек товаров) */
        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .product-card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .product-card h3 {
            font-size: 1.2em;
            margin: 10px 0;
        }
        .product-card .price {
            font-size: 1.1em;
            color: #007bff;
            font-weight: bold;
            display: block;
            margin-bottom: 10px;
        }
        .product-card .add-to-cart {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- HEADER (Шапка сайта) -->
    <header>
        <h1>МойМагазин</h1>
        <nav>
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('posts') }}">Каталог</a>
            <a href="{{ url_for('about') }}">О нас</a>
            <a href="#">Описание</a>
          
            
        </nav>
    </header>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    

    <!-- FOOTER (Подвал сайта) -->
    <footer>
        <p>&copy; 2025 Все права защищены.  </p>
    </footer>

</body>
</html>
